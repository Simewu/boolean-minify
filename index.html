<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quine McCluskey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px 0;
        }
        .container {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 90%;
            margin: auto;
        }
        .section {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 400px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 0.85em;
            padding: 8px;
        }
        .middle {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .begin-btn {
            margin-top: 25px;
            height: 120px;
            width: 100px;
            font-size: 1.1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <label for="oracle">Oracle Function</label>
            <textarea id="oracle">
function oracle(A, B, C, D) {
    const num = (A << 3) | (B << 2) | (C << 1) | D;

    if ([4, 8, 10, 11, 12].includes(num))
        return true;

    if ([9, 14].includes(num))
        return undefined;

    if (num === 15)
        return false;

    return false;
}
            </textarea>
            </textarea>
        </div>
        <div class="middle">
            <button class="begin-btn" onclick="begin()">Begin</button>
        </div>
        <div class="section">
            <label for="output">Output Function</label>
            <textarea id="output"></textarea>
        </div>
    </div>
</body>

<script>
    // Generate Pascal's triangle table for binomial coefficients (BigInt)
    function binomialCoefficientTable(n, k) {
        const table = Array.from({ length: n + 1 }, () => Array(k + 1).fill(0n));
        for (let i = 0; i <= n; i++) {
            table[i][0] = 1n;
            for (let j = 1; j <= Math.min(i, k); j++) {
                table[i][j] = (j === i) ? 1n : table[i - 1][j - 1] + table[i - 1][j];
            }
        }
        return table;
    }

    // Get the indices of the rank-th combination in lex order
    function unrankLex(n, k, rank, table) {
        let remainingRank = BigInt(rank);
        const indices = new Array(k);
        let start = 0;
        for (let placed = 0; placed < k; placed++) {
            const remaining = k - placed - 1;
            let lo = start, hi = n - (remaining + 1), ans = start;
            while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                const count = table[n - (mid + 1)][remaining];
                if (count > remainingRank) { ans = mid; hi = mid - 1; }
                else { remainingRank -= count; lo = mid + 1; }
            }
            indices[placed] = ans;
            start = ans + 1;
        }
        return indices;
    }

    // Advance to the next combination
    function nextCombination(indices, n) {
        const k = indices.length;
        let i = k - 1;
        while (i >= 0 && indices[i] === i + (n - k)) i--;
        if (i < 0) return null;
        indices[i]++;
        for (let j = i + 1; j < k; j++) {
            indices[j] = indices[j - 1] + 1;
        }
        return indices;
    }

    // Convert indices to bit array
    function indicesToBits(n, indices) {
        const bits = Array(n).fill(0);
        for (let i = 0; i < indices.length; i++) bits[indices[i]] = 1;
        return bits;
    }

    // Generator: yield combinations passing oracle filter
    function* binomialCoefficientFilterGen(n, k, oracleFunction, opts = {}) {
        const table = opts.table || binomialCoefficientTable(n, k);
        const total = table[n][k];
        if (k < 0 || k > n || total === 0n) return;

        let start = BigInt(opts.start ?? 0);
        let end = opts.end !== undefined ? BigInt(opts.end) : total;
        if (start < 0n) start = 0n;
        if (end > total) end = total;
        if (start >= end) return;

        let indices = unrankLex(n, k, start, table);

        for (let r = start; r < end; r++) {
            const bits = indicesToBits(n, indices);
            const oracleResult = oracleFunction(...bits);
            if (oracleResult === true || oracleResult === undefined) {
                yield {
                    bits: bits.join(''),
                    oracle_response: oracleResult === true ? true : undefined,
                    rank: r
                };
            }
            if (r + 1n === end) break;
            if (nextCombination(indices, n) === null) break;
        }
    }

    // Collect all filtered combinations into an array
    function binomialCoefficientFilter(n, k, oracleFunction, opts = {}) {
        const result = [];
        for (const item of binomialCoefficientFilterGen(n, k, oracleFunction, opts)) result.push(item);
        return result;
    }

    // Get the bit string for the i-th combination
    function getCombinationBitString(n, k, i, table = binomialCoefficientTable(n, k)) {
        const indices = unrankLex(n, k, i, table);
        return indicesToBits(n, indices).join('');
    }

    function begin() {
        const oracleFunction = document.getElementById('oracle').value;

        const oldScript = document.getElementById('insert-oracle');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'insert-oracle';
        script.textContent = oracleFunction;
        document.body.appendChild(script);

        const oracleHeader = window.oracle.toString().match(/\(([^)]+)\)/);
        const numVariables = oracleHeader ? oracleHeader[1].split(',').length : 0;
        const outputArea = document.getElementById('output');


        for (let k = 1; k <= numVariables+1; k++) {
            const listMinterms = [];
            const listDontCares = [];

            const filtered = binomialCoefficientFilter(numVariables, k, window.oracle);
            for (const item of filtered) {
                const decimalValue = parseInt(item.bits, 2);
                if (item.oracle_response === true) listMinterms.push(decimalValue);
                else if (item.oracle_response === undefined) listDontCares.push(decimalValue);
            }

            outputArea.value += `K = ${k}\n`;
            outputArea.value += `Minterms: ${listMinterms.join(', ')}\n`;
            outputArea.value += `Dont Cares: ${listDontCares.join(', ')}\n\n`;
        }

        outputArea.value = 'Number of variables: ' + numVariables + '\n\n';
    }

</script>

<script id="insert-oracle" type="text/javascript"></script>

</html>
