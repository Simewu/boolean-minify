    <style>
        body {
            background-color: #151719;
            font-family: 'Times New Roman', Times, serif;
            padding: 20px;
        }

        p {
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
        }

        input[type='checkbox'].form-check-input:checked {
            background-color: #b0b0b0 !important;
            border-color: #b0b0b0 !important;
        }

        input[type='checkbox'].form-check-input:focus {
            box-shadow: 0 0 0 0.2rem rgba(176, 176, 176, 0.25) !important;
            border-color: #b0b0b0 !important;
        }

        input[type='checkbox'].form-check-input {
            accent-color: #b0b0b0 !important;
        }

        .CodeMirror {
            height: auto;
            font-size: 0.7rem;
        }

        .handsontable {
            background: #0f1113;
            border-radius: 0.5rem;
        }

        /* Surfaces */
        .handsontable .ht_master,
        .handsontable .ht_clone_left,
        .handsontable .ht_clone_top,
        .handsontable .ht_clone_top_left_corner {
            background: #292E33 !important;
        }

        /* Cells */
        .handsontable td,
        .handsontable th {
            background-color: #292E33 !important;
            border-color: #3A4046 !important;
        }

        /* Text */
        .handsontable td {
            color: #EEFFFF !important;
            font-size: 0.7rem;
        }

        .handsontable th {
            color: #FFFFFF !important;
            font-weight: 500;
            font-size: 0.7rem;
        }

        /* Selection */
        .handsontable .current,
        .handsontable .active {
            background: #23262a !important;
            box-shadow: inset 0 0 0 1px #FFCC00 !important;
        }

        .handsontable .area {
            background: #2A2E33 !important;
        }

        .handsontableInput {
            background: #1E2124 !important;
            color: #EEFFFF !important;
            border-color: #FFCC00 !important;
        }

        /* Highlighted headers */
        .handsontable th.ht__highlight,
        .handsontable th.ht__active_highlight {
            color: #EEFFFF !important;
        }

        /* Checkboxes */
        .handsontable input[type='checkbox'] {
            accent-color: #FFCC00;
            filter: invert(0.9) hue-rotate(180deg);
        }

        .handsontable span.colHeader.columnSorting.descending:before,
        .handsontable span.colHeader.columnSorting.ascending:before {
            filter: invert(1) hue-rotate(180deg);
        }
    </style>

                    <textarea id='oracle-code' class='form-control' hidden>
function oracle(A, B, C, D, E) {
  const n = [A, B, C, D].reduce((index, bit) => index * 2 + (bit ? 1 : 0), 0); // Pack boolean inputs into an integer
  
  if ([1, 4, 6, 9, 10, 11, 12, 15].includes(n)) return true;
  if ([9, 14].includes(n)) return undefined; // Don't cares
  return false;
  
  // Another example
  const t1 = (((D & 1) | ((B ^ 1) & D)) ^ 1);
  const t2 = (A & (B | (B ^ 1)));
  const t3 = (A & (C ^ 1));
  const t4 = (A & C);
  const t5 = ((D ^ 1) & B & (B ^ 1));
  const t6 = (D & 0);
  const t7 = (((B & 0) | ((B ^ 1) & 0)) & D);
  const value = t1 | t2 | t3 | t4 | t5 | t6 | t7;
  return !!value;
}</textarea>

<script>
    'use strict';
    let variableNames = [], usedVariableNames = [], outputTableNeedsUpdate = true;
    let runTimeout = null;

    function error(e) {
        const errorIndicator = document.getElementById('errorIndicator');
        if (errorIndicator) {
            errorIndicator.style.display = '';
            errorIndicator.title = e && e.message ? e.message : String(e);
        }
        console.log('Error:', e && e.message ? e.message : String(e));
    }

    console.error = function (e) {
        error(e);
    };

    function applyInputOracleScript(type) {
        const oldScript = document.getElementById('insert-oracle');
        if (oldScript) oldScript.remove();

        if (type === undefined) {
            if (document.getElementById('inputCode').checked) type = 'code';
            else if (document.getElementById('inputTruthTable').checked) type = 'table';
            else if (document.getElementById('inputSATInstance').checked) type = 'sat';
            else type = 'code';
        }

        const script = document.createElement('script');
        let oracleCode = '';
        if (type === 'code') {
            oracleCode = editorCode.getValue();
        } else if (type === 'table') {
            oracleCode = generateTruthTableOracleFunction();
        } else if (type === 'sat') {
            oracleCode = generateSATInstanceOracleFunction();
        }
        script.id = 'insert-oracle';
        script.textContent = oracleCode;
        script.onerror = (e) => {
            error(e);
        };
        window.oracle = null;
        document.body.appendChild(script);

        if (typeof window.oracle !== 'function') {
            error(new Error('Function oracle(...) not defined'));
            return false;
        }
        return true;
    }

    function applyOutputOracleScript() {
        const oldScript = document.getElementById('insert-oracle');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        const oracleCode = outputCode.getValue();
        script.id = 'insert-oracle';
        script.textContent = oracleCode;
        script.onerror = (e) => {
            error(e);
        };
        window.oracle = null;
        document.body.appendChild(script);

        if (typeof window.oracle !== 'function') {
            error(new Error('Oracle function not defined'));
            return false;
        }
        return true;
    }

    // Prevent multiple runs in quick succession
    function run() {
        if (runTimeout) {
            clearTimeout(runTimeout);
            runTimeout = null;
        }
        runTimeout = setTimeout(() => {
            runTimeout = null;
            _run();
        }, 100);
    }

    function _run() {
        if (!applyInputOracleScript()) return;

        // Extract the input argument names
        const oracleHeader = window.oracle.toString().match(/\(([^)]*)\)/);
        const paramList = oracleHeader ? oracleHeader[1] : '';
        const parsedNames = paramList.split(',').map(s => s.trim()).filter(Boolean);
        variableNames = (parsedNames.length ? parsedNames : QuineMcCluskey.defaultVarNames(parsedNames.length));

        // CNF is true, DNF is false
        const isCNF = document.getElementById('formCnfDnfCheckbox').checked;
        let output, kmapObject, outputs = ['expr', 'sat'];

        if (document.getElementById('outputKMap').checked) outputs.push('kmap');

        if (isCNF) {
            output = QuineMcCluskey.solveCNF(variableNames, window.oracle, outputs);
        } else {
            output = QuineMcCluskey.solveDNF(variableNames, window.oracle, outputs);
        }

        // Assign Karnaugh map and SAT output
        if (output && output.kmap) kmapData = output.kmap;
        if (output && output.sat) {
            if (typeof outputSat !== 'undefined' && outputSat) outputSat.setValue(output.sat);
        }

        if (output && output.expr) {
            const expression = output.expr;
            renderExpressionTextbox(expression);
            circuitExpression = expression.replace(/&&/g, '&').replace(/\|\|/g, '|');

            // Fetch used variables from expression
            const identifierRegex = /\b[A-Za-z_][A-Za-z0-9_]*\b/g;
            const used = new Set();
            let match;
            while ((match = identifierRegex.exec(expression)) !== null) {
                const name = match[0];
                // Filter to original vars (skip literals)
                if (variableNames.includes(name) && name !== 'true' && name !== 'false') {
                    used.add(name);
                }
            }
            // Only keep used variable names
            const maintainVars = document.getElementById('maintainVarsCheckbox').checked;
            if (maintainVars) {
                usedVariableNames = variableNames.slice();
            } else {
                usedVariableNames = variableNames.filter(v => used.has(v));
            }
            const funcArgs = usedVariableNames.join(',');
            const funcBody = 'return ' + expression + ';';
            const finalFunction = 'function oracle(' + funcArgs + ') {\n  ' + funcBody + '\n}';
            if (typeof outputCode !== 'undefined' && outputCode) {
                outputCode.setValue(finalFunction);
            }
            console.log(finalFunction);
        } else {
            // No expression generated
            circuitExpression = '';
            usedVariableNames = [];
            if (typeof outputCode !== 'undefined' && outputCode) {
                outputCode.setValue('// No expression generated');
            }
        }

        outputTableNeedsUpdate = true;
        if (document.getElementById('outputTruthTable').checked) {
            if (output && output.expr) {
                setupOutputTable();
            }
        }
        if (document.getElementById('outputKMap').checked) {
            if (kmapData) {
                renderKarnaughMapTable();
            }
        }
        if (document.getElementById('outputCircuit').checked) {
            if (circuitExpression && circuitExpression.length) {
                renderLogicCircuit();
            }
        }

        document.getElementById('runButton').disabled = document.getElementById('autoRunCheckbox').checked;
        document.getElementById('copyButton').disabled = !(output && output.expr);

        const errorIndicator = document.getElementById('errorIndicator');
        if (errorIndicator) {
            errorIndicator.style.display = 'none';
        }
    }
</script>

<script id='insert-oracle' type='text/javascript'></script>

<script>
    let editorCode, editorSat, outputCode, outputSat;

    function copyOutputToInput() {
        if (document.getElementById('inputCode').checked) {
            editorCode.setValue(outputCode.getValue());
            variableNames = usedVariableNames.slice();
            showInputTab('code');
        } else if (document.getElementById('inputTruthTable').checked) {
            showInputTab('table');
            inputTruthTableVariableNames = variableNames.slice();
            setupTable(document.getElementById('oracle-table'), inputTruthTableVariableNames, false);
        } else if (document.getElementById('inputSATInstance').checked) {
            editorSat.setValue(outputSat.getValue());
            showInputTab('sat');
        }
    }

    function showInputTab(tab) {
        document.getElementById('inputTab-code').style.display = (tab === 'code') ? '' : 'none';
        if (tab === 'table') {
            document.getElementById('inputTab-table').style.display = '';
            if (!inputTruthTableVariableNames.length) { // First time setup
                restoreInputTable();
            }
        } else {
            document.getElementById('inputTab-table').style.display = 'none';
        }
        document.getElementById('inputTab-sat').style.display = (tab === 'sat') ? '' : 'none';

        if (tab === 'code' && editorCode) setTimeout(() => editorCode.refresh(), 0);
        if (tab === 'sat' && editorSat) setTimeout(() => editorSat.refresh(), 0);

        document.getElementById('runButton').disabled = false;
    }

    function showOutputTab(tab) {
        document.getElementById('outputTab-code').style.display = (tab === 'code') ? '' : 'none';
        if (tab === 'table') {
            document.getElementById('outputTab-table').style.display = '';
            if (outputTableNeedsUpdate) { // First time setup
                setupOutputTable();
            }
        } else {
            document.getElementById('outputTab-table').style.display = 'none';
        }
        document.getElementById('outputTab-sat').style.display = (tab === 'sat') ? '' : 'none';
        if (tab === 'circuit') {
            document.getElementById('outputTab-circuit').style.display = '';
            renderLogicCircuit();
        } else {
            document.getElementById('outputTab-circuit').style.display = 'none';
        }
        if (tab === 'kmap') {
            document.getElementById('outputTab-kmap').style.display = '';
            if (document.getElementById('autoRunCheckbox').checked) {
                run();
            }
        } else {
            document.getElementById('outputTab-kmap').style.display = 'none';
        }

        if (tab === 'code' && outputCode) setTimeout(() => outputCode.refresh(), 0);
        if (tab === 'sat' && outputSat) setTimeout(() => outputSat.refresh(), 0);
    }

    function checkAutoRunChanged() {
        document.getElementById('runButton').disabled = document.getElementById('autoRunCheckbox').checked;
        if (document.getElementById('autoRunCheckbox').checked) {
            console.log('Auto-run enabled');
            run();
        } else {
            console.log('Auto-run disabled');
        }
    }

    function toggleCNFDNF() {
        const isCNF = document.getElementById('formCnfDnfCheckbox').checked;
        var label = document.getElementById('formCnfDnfLabel');
        if (isCNF) {
            label.textContent = 'Form: CNF';
        } else {
            label.textContent = 'Form: DNF';
        }
    }

    function renderExpressionTextbox(jsExpression) {
        let mathExpr = jsExpression.replace(/!([A-Za-z_][A-Za-z0-9_]*)/g, (m, v) => v + '\'');
        mathExpr = mathExpr.replace(/\s*&&\s*/g, '.');
        mathExpr = mathExpr.replace(/\s*\|\|\s*/g, '+');
        const outputExpression = document.getElementById('output-expression');
        outputExpression.value = mathExpr;
    }

    // Setup CodeMirror editors
    function setupSampleCodeEditors() {
        const optionsOracleCode = {
            autofocus: false,
            autohint: true,
            dragDrop: false,
            lineNumbers: true,
            lineWrapping: true,
            lineWiseCopyCut: true,

            lint: {
                esversion: 6
            },
            gutters: ['CodeMirror-lint-markers'],
            lintOnChange: true,

            mode: {
                name: 'javascript',
                globalVars: true
            },
            readOnly: false,
            theme: 'material-darker',
            undoDepth: 1000,

            matchBrackets: true,
            highlightSelectionMatches: true,
            autoCloseBrackets: true
        };

        const optionsSAT = {
            autofocus: false,
            autohint: true,
            dragDrop: false,
            lineNumbers: true,
            lineWrapping: true,
            lineWiseCopyCut: true,
            readOnly: false,
            theme: 'material-darker',
            undoDepth: 1000
        };

        const optionsOutputCode = { ...optionsOracleCode, readOnly: true };
        const optionsOutputSat = { ...optionsSAT, readOnly: true };

        editorCode = CodeMirror.fromTextArea(document.getElementById('oracle-code'), optionsOracleCode);
        editorSat = CodeMirror.fromTextArea(document.getElementById('oracle-sat'), optionsSAT);
        outputCode = CodeMirror.fromTextArea(document.getElementById('output-code'), optionsOutputCode);
        outputSat = CodeMirror.fromTextArea(document.getElementById('output-sat'), optionsOutputSat);

        editorCode.on('change', function (cMirror) {
            if (document.getElementById('autoRunCheckbox').checked) run();
        });

        editorSat.on('change', function (cMirror) {
            if (document.getElementById('autoRunCheckbox').checked) run();
        });
    }

    // Format the code editors
    function formatCodeEditors() {
        editorCode.autoFormatRange({ line: 0, ch: 0 }, { line: editorCode.lineCount() });
        editorSat.autoFormatRange({ line: 0, ch: 0 }, { line: editorSat.lineCount() });
        outputCode.autoFormatRange({ line: 0, ch: 0 }, { line: outputCode.lineCount() });

    function updateTableResultHash(container) {
        let resultString = '';
        if (container && container._handsontableInstance) {
            const hot = container._handsontableInstance;
            const rowCount = hot.countRows();
            const resultCol = hot.countCols() - 1;
            for (let row = 0; row < rowCount; row++) {
                const v = hot.getDataAtCell(row, resultCol);
                resultString += (v === '' || v === null || v === undefined) ? 'x' : (v ? '1' : '0');
            }
        } else {
            resultString = truthTableValues
                .map(v => (v === '' || v === null || v === undefined) ? 'x' : (v ? '1' : '0'))
                .join('');
        }
        let label = 'Result';
        try {
            const truncatedHash = sha256(resultString).slice(0, 4).toUpperCase();
            label = `Result (hash=${truncatedHash})`;
        } catch (e) {
            label = 'Result';
        }
        if (container && container._handsontableInstance) {
            const hot = container._handsontableInstance;
            const currentColWidths = hot.getColWidths ? hot.getColWidths() : undefined;
            const headers = [...variableNames, label];
            hot.updateSettings({ colHeaders: headers });
            if (currentColWidths && Array.isArray(currentColWidths)) {
                hot.updateSettings({ colWidths: currentColWidths });
            }
        }
        return label;
    }

    function setupTable(container, variableNames, readonly) {
        container.classList.add('ht-theme-main');

        if (container._handsontableInstance) {
            container._handsontableInstance.destroy();
            container._handsontableInstance = null;
        }
        container.innerHTML = '';

        let headers = [...variableNames, 'Result'];
        const numVars = variableNames.length;
        const rowCount = 1 << numVars;

        truthTableValues = []; // Reset before filling

        const data = Array.from({ length: rowCount }, (_, idx) => {
            const row = [];
            for (let bit = numVars - 1; bit >= 0; bit--) {
                row.push((idx >> bit) & 1);
            }
            let result;
            try {
                result = window.oracle(...row.map(Boolean));
            } catch (e) {
                result = 'ERROR: ' + e.message;
            }
            const resultValue = result === undefined ? '' : +!!result;
            row.push(resultValue);
            truthTableValues.push(resultValue);
            return row;
        });

        // Compute "Result (hash=XXXXXX)" header
        headers[headers.length - 1] = updateTableResultHash(container);

        const columns = Array.from({ length: variableNames.length }, () => ({
            type: 'numeric',
            className: 'htCenter htMiddle',
            readOnly: true
        }));
        columns.push({ type: 'numeric', className: 'htCenter htMiddle' });
        const enableRowHeader = true;
        const rowHeaderWidth = enableRowHeader ? 20 : 0;
        const baseColWidth = 40;
        const scrollbarWidth = 18;
        const minTableWidth = rowHeaderWidth + (variableNames.length + 1) * baseColWidth + scrollbarWidth;
        let width = container.clientWidth || (container.parentElement && container.parentElement.clientWidth) || minTableWidth;
        width = Math.max(width, minTableWidth);
        if (container.clientWidth) {
            width = Math.min(width, container.clientWidth);
        }

        let colWidths = Array(variableNames.length).fill(baseColWidth);
        let resultColWidth = width - rowHeaderWidth - scrollbarWidth - (variableNames.length * baseColWidth);
        resultColWidth = Math.max(resultColWidth, baseColWidth);
        colWidths.push(resultColWidth);

        // Compute table height
        let tableHeight = Math.min(360, 32 + rowCount * 24);

        let options = {
            data,
            columns,
            columnSorting: {
                sortEmptyCells: true,
                indicator: true,
                headerAction: true,
                compareFunctionFactory(sortOrder, columnMeta) {
                    return function (value, nextValue) {
                        const rank = v => (v === '' || v == null) ? 0 : v ? 1 : 2;
                        const result = rank(value) - rank(nextValue);
                        return sortOrder === 'asc' ? result : -result;
                    };
                },
            },
            colHeaders: headers,
            rowHeaders: enableRowHeader,
            rowHeaderWidth: enableRowHeader ? rowHeaderWidth : undefined,
            colWidths: colWidths,
            stretchH: 'none',
            height: tableHeight,
            width: width,
            autoWrapRow: false,
            autoWrapCol: false,
            contextMenu: false,
            licenseKey: 'non-commercial-and-evaluation'
        }

        if (readonly) {
            options.readOnly = true;

            options.afterSelectionEnd = function (rowStart, colStart, rowEnd, colEnd) {
                // Undo sorting if top-left corner cell is selected
                if (rowStart === -1 && rowEnd === this.countRows() - 1 && colStart === -1 && colEnd === this.countCols() - 1) {
                    this.getPlugin('columnSorting').clearSort();
                }
            };
        } else {
            options.readOnly = false;
            // Only allow selection of the result column
            options.beforeSetRangeStart = function (coords) {
                coords.col = variableNames.length;
            };

            options.beforeSetRangeEnd = function (coords) {
                coords.col = variableNames.length;
            };

            // Prevent selecting other columns in mouse drag
            options.afterSelection = function (row, col, row2, col2) {
                const resultCol = variableNames.length;
                if (row === -1) {
                    // Undo sorting if top-left corner cell is selected
                    if (col === -1 || col2 === -1) {
                        this.getPlugin('columnSorting').clearSort();
                    }
                    this.selectCell(0, resultCol, this.countRows() - 1, resultCol, false, false);
                } else if (col !== resultCol || col2 !== resultCol) {
                    this.selectCell(row, resultCol, row2, resultCol, false, false);
                }
            };

            // Make variable columns read-only and custom renderer for result column
            options.cells = function (row, col) {
                if (col !== variableNames.length) {
                    return { readOnly: true };
                }
            };

            // Store last selection for bulk edit
            options.afterSelectionEnd = function (rowStart, colStart, rowEnd, colEnd) {
                this._lastSelection = { rowStart, colStart: variableNames.length, rowEnd, colEnd: variableNames.length };
            };

            // Handle result column changes and bulk fill
            options.afterChange = function (changes, source) {
                if (!changes) return;
                const hotInstance = this;
                const resultCol = variableNames.length;
                for (const [row, col, oldValue, newValue] of changes) {
                    if (col !== resultCol) continue;

                    let val;
                    if (newValue === '' || newValue === null || newValue === undefined) {
                        val = '';
                    } else if (
                        newValue === 1 || newValue === true || (typeof newValue === 'string' && /^(1|t|true|y|yes)$/i.test(newValue.trim()))) {
                        val = 1;
                    } else if (
                        newValue === 0 || newValue === false || (typeof newValue === 'string' && /^(0|f|false|n|no)$/i.test(newValue.trim()))) {
                        val = 0;
                    } else {
                        val = '';
                    }
                    truthTableValues[row] = val;
                    const display = val;

                    // Bulk fill for selection
                    if (source === 'edit' && hotInstance._lastSelection) {
                        const { rowStart, rowEnd, colStart, colEnd } = hotInstance._lastSelection;
                        if (colStart === resultCol && colEnd === resultCol) {
                            const r1 = Math.min(rowStart, rowEnd), r2 = Math.max(rowStart, rowEnd);
                            for (let r = r1; r <= r2; r++) {
                                if (r === row) continue;
                                hotInstance.setDataAtCell(r, resultCol, display, 'bulkFill');
                                truthTableValues[r] = val;
                            }
                        }
                    }

                    if (hotInstance.getDataAtCell(row, col) !== display) {
                        hotInstance.setDataAtCell(row, col, display, 'internal');
                    }
                }

                // Recompute header hash after any change
                updateTableResultHash(container);

                if (document.getElementById('autoRunCheckbox').checked) run();
            };
        }

        const hot = new Handsontable(container, options);
        container._handsontableInstance = hot;
    }

    function renderKarnaughMapTable() {

            const numVars = variableNames.length;

            for (let i = 0; i < rowVars.length; i++) {
                bits[rowVars[i]] = rowGrayLabels[rowIdx][i] || '0';
            }
            for (let j = 0; j < colVars.length; j++) {
                bits[colVars[j]] = colGrayLabels[colIdx][j] || '0';

            if (bits.length !== pattern.length) return false;
            for (let i = 0; i < bits.length; i++) {

                    return false;

                for (let colIdx = 0; colIdx < colGrayLabels.length; colIdx++) {
                    const bits = getCellBits(rowIdx, colIdx);
                    if (doesBitsMatchPattern(bits, pattern) && values[rowIdx][colIdx] === DNF_CNF_VALUE_ONE) {
                        cellGroupMap[rowIdx][colIdx] = groupIdx;
                    }

        const numCols = colGrayLabels.length, numRows = rowGrayLabels.length;
        const availableWidth = cssWidth - minLeftHeaderWidth - padRight;

                if (needRightCopy) { drawRoundedRect(x - gridWidth, y + gridHeight, w, h, Math.min(r, Math.min(w, h) / 2 - 1)); ctx.stroke(); }

            if (needBottomCopy) {

            // Find used rows and columns for this group
            const rowsInGroup = Array(rowGrayLabels.length).fill(false);
            const colsInGroup = Array(colGrayLabels.length).fill(false);
            for (let row = 0; row < rowGrayLabels.length; row++) {
                for (let col = 0; col < colGrayLabels.length; col++) {
                    if (cellGroupMap[row][col] === groupIdx) {
                        rowsInGroup[row] = true;
                        colsInGroup[col] = true;
                    }
                }
            }
            // Build segments that wrap around edges
            function buildSegments(usedIndices) {
                const length = usedIndices.length;
                const segments = [];
                let i = 0;
                while (i < length) {
                    while (i < length && !usedIndices[i]) i++;
                    if (i >= length) break;
                    const start = i;
                    while (i < length && usedIndices[i]) i++;
                    const end = i;
                    segments.push([start, end]);
                }
                if (segments.length > 1 && usedIndices[0] && usedIndices[length - 1]) {
                    const first = segments.shift();
                    const last = segments.pop();
                    segments.unshift([last[0], first[1]]);
                }
                return segments;
            }
            const rowSegments = buildSegments(rowsInGroup);
            const colSegments = buildSegments(colsInGroup);
            if (!rowSegments.length || !colSegments.length) continue;
            const totalRows = rowGrayLabels.length;
            const totalCols = colGrayLabels.length;
            function getSpanCount(start, end, length) {
                return start <= end ? (end - start) : ((length - start) + end);
            }
            for (const [rowStart, rowEndRaw] of rowSegments) {
                for (const [colStart, colEndRaw] of colSegments) {
                    const rowSpan = Math.max(1, getSpanCount(rowStart, rowEndRaw, totalRows));
                    const colSpan = Math.max(1, getSpanCount(colStart, colEndRaw, totalCols));
                    const topLeft = getCellRect(rowStart, colStart);
                    const minX = topLeft.x;
                    const minY = topLeft.y;
                    const width = Math.max(2, colSpan * cellWidth);
                    const height = Math.max(2, rowSpan * cellHeight);
                    const pad = groupPadding;
                    const x = minX + pad;
                    const y = minY + pad;
                    const w = Math.max(2, width - 2 * pad);
                    const h = Math.max(2, height - 2 * pad);
                    strokeRoundedRectToroidal(x, y, w, h, radius, getGroupColor(groupIdx));
                }
            }
        }
    }

    function fillTruthTableSelection(value) {
        const container = document.getElementById('oracle-table');
        const hot = container._handsontableInstance;
        if (!hot) return;

        const resultCol = inputTruthTableVariableNames.length;
        // Use last selection if available, otherwise select all rows in result column
        let sel;
        if (hot._lastSelection) {
            sel = hot._lastSelection;
        } else {
            sel = {
                rowStart: 0,
                rowEnd: hot.countRows() - 1,
                colStart: resultCol,
                colEnd: resultCol
            };
        }
        const startRow = Math.min(sel.rowStart, sel.rowEnd);
        const endRow = Math.max(sel.rowStart, sel.rowEnd);
        for (let row = startRow; row <= endRow; row++) {
            hot.setDataAtCell(row, resultCol, value, 'bulkFill');
        }
        // Restore selection
        hot.selectCell(sel.rowStart, sel.colStart, sel.rowEnd, sel.colEnd, false, false);
        hot._lastSelection = sel;
    }

    function generateTruthTableOracleFunction() {
        const varList = inputTruthTableVariableNames.join(', ');
        const valuesArray = JSON.stringify(truthTableValues);
        return `function oracle(${varList}) {
    const values = ${valuesArray};
    const index = [${inputTruthTableVariableNames.join(', ')}].reduce((acc, val) => acc * 2 + (val ? 1 : 0), 0);
    const v = values[index];
    if (v === 1 || v === '1') return true;
    if (v === 0 || v === '0') return false;
    return undefined;
}`;
    }

    // Parse SAT instance from editor and generate an oracle function
    function generateSATInstanceOracleFunction() {
        const raw = editorSat.getValue();
        const lines = raw.split(/\r?\n/);

        let declaredVars = 0, declaredClauses = 0;
        let format = 'cnf';
        const clauses = [];
        let maxVar = 0;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line || line.startsWith('c')) continue;
            if (line.startsWith('p')) {
                // Parse problem line: e.g. 'p cnf 5 6'
                const match = /^p\s+(cnf|dnf)\s+(\d+)\s+(\d+)/i.exec(line);
                if (match) {
                    format = match[1].toLowerCase();
                    declaredVars = parseInt(match[2], 10);
                    declaredClauses = parseInt(match[3], 10);
                }
                continue;
            }
            // Parse clause literals
            const nums = line.split(/\s+/).map(Number).filter(n => !Number.isNaN(n));
            if (!nums.length) continue;

            let clause = [];
            for (const lit of nums) {
                if (lit === 0) {
                    // End of clause
                    if (clause.length) {
                        clauses.push(clause);
                        clause = [];
                    }
                    continue;
                }
                maxVar = Math.max(maxVar, Math.abs(lit));
                clause.push(lit);
            }
            if (clause.length) clauses.push(clause);
        }

        // Use declared variable count or max seen
        const varCount = declaredVars || maxVar;
        if (!varCount) throw new Error('SAT instance has no variables.');

        const paramNames = QuineMcCluskey.defaultVarNames(varCount);

        let jsClauses = [];
        let body = '';

        // Convert SAT clauses to JS logic
        if (format === 'dnf') {
            for (const clause of clauses) {
                if (clause.length) {
                    const parts = clause.map(lit => {
                        const idx = Math.abs(lit) - 1;
                        const v = paramNames[idx];
                        return lit > 0 ? v : '!' + v;
                    });
                    jsClauses.push('(' + parts.join(' && ') + ')');
                } else {
                    jsClauses.push('(true)');
                }
            }
            body = jsClauses.length ? jsClauses.join(' || ') : 'false';
        } else {
            for (const clause of clauses) {
                if (clause.length) {
                    const parts = clause.map(lit => {
                        const idx = Math.abs(lit) - 1;
                        const v = paramNames[idx];
                        return lit > 0 ? v : '!' + v;
                    });
                    jsClauses.push('(' + parts.join(' || ') + ')');
                } else {
                    jsClauses.push('(false)');
                }
            }
            body = jsClauses.length ? jsClauses.join(' && ') : 'true';
        }

        // Return the generated oracle function as a string
        return `function oracle(${paramNames.join(', ')}) {
    return ${body};
}`;
    }

    window.onload = function () {
        setupSampleCodeEditors();
        showOutputTab('kmap');
        run();
    };
