<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <title>Boolean Expression Minimization: Quine-McCluskey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px 0;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 90%;
            margin: auto;
        }

        .section {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 400px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 0.85em;
            padding: 8px;
        }

        .middle {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .run-btn {
            margin-top: 25px;
            height: 120px;
            width: 100px;
            font-size: 1.1em;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class='container'>
        <div class='section'>
            <label for='oracle'>Oracle Function</label>
            <textarea id='oracle'>
function oracle(A, B, C, D) {
    const num = (A << 3) | (B << 2) | (C << 1) | D;

    if ([0b0100, 0b1000, 0b1010, 0b1011, 0b1100].includes(num))
        return true;

    if ([0b1001, 0b1110].includes(num))
        return undefined; // Don't cares

    if (num === 0b1111)
        return true;

    return false;
}</textarea>
        </div>
        <div class='middle'>
            <button class='run-btn' onclick='run()'>Run</button>
        </div>
        <div class='section'>
            <label for='output'>Output Function</label>
            <textarea id='output'></textarea>
        </div>
    </div>
</body>

<script>
    'use strict';

    class BinomialCoefficients {
        static pascalTableCache = new Map();
        static bitWeightsCache = new Map();

        // Generate Pascal's triangle table for binomial coefficients (BigInt)
        static pascalTable(n, k) {
            const key = n + '|' + k;
            const cached = BinomialCoefficients.pascalTableCache.get(key);
            if (cached) return cached;
            const table = Array.from({ length: n + 1 }, () => Array(k + 1).fill(0n));
            for (let i = 0; i <= n; i++) {
                table[i][0] = 1n;
                for (let j = 1; j <= Math.min(i, k); j++) {
                    table[i][j] = (j === i) ? 1n : table[i - 1][j - 1] + table[i - 1][j];
                }
            }
            BinomialCoefficients.pascalTableCache.set(key, table);
            return table;
        }

        static bitWeights(n) {
            const hit = BinomialCoefficients.bitWeightsCache.get(n);
            if (hit) return hit;
            const weights = Array.from({ length: n }, (_, i) => 1n << BigInt(n - 1 - i));
            BinomialCoefficients.bitWeightsCache.set(n, weights);
            return weights;
        }

        static unrankLex(n, k, rank, pascalTable) {
            let remainingRank = BigInt(rank);
            const indices = new Array(k);
            let start = 0;
            for (let placed = 0; placed < k; placed++) {
                const remaining = k - placed - 1;
                let lo = start, hi = n - (remaining + 1), ans = start;
                while (lo <= hi) {
                    const mid = Math.floor((lo + hi) / 2);
                    const count = pascalTable[n - (mid + 1)][remaining];
                    if (count > remainingRank) { ans = mid; hi = mid - 1; }
                    else { remainingRank -= count; lo = mid + 1; }
                }
                indices[placed] = ans;
                start = ans + 1;
            }
            return indices;
        }

        static nextCombination(indices, n) {
            const k = indices.length;
            let i = k - 1;
            while (i >= 0 && indices[i] === i + (n - k)) i--;
            if (i < 0) return null;
            indices[i]++;
            for (let j = i + 1; j < k; j++) {
                indices[j] = indices[j - 1] + 1;
            }
            return indices;
        }

        static nextCombinationAndPatch(indices, n, bits, weights, box) {
            const k = indices.length;
            let i = k - 1;
            while (i >= 0 && indices[i] === i + (n - k)) i--;
            if (i < 0) return null;
            for (let j = k - 1; j >= i; j--) {
                const pos = indices[j];
                if (bits[pos] === 1) {
                    bits[pos] = 0;
                    box.value -= weights[pos];
                }
            }
            indices[i]++;
            bits[indices[i]] = 1;
            box.value += weights[indices[i]];
            for (let j = i + 1; j < k; j++) {
                indices[j] = indices[j - 1] + 1;
                bits[indices[j]] = 1;
                box.value += weights[indices[j]];
            }
            return indices;
        }

        static indicesToBits(n, indices) {
            const bits = Array(n).fill(0);
            for (let i = 0; i < indices.length; i++) bits[indices[i]] = 1;
            return bits;
        }

        // Generator: yield combinations passing oracle filter
        static *filterGenerator(n, k, oracleFunction) {
            const includeBits = true;
            const pascalTable = BinomialCoefficients.pascalTable(n, k);
            const total = pascalTable[n][k];
            if (k < 0 || k > n || total === 0n) return;

            let start = 0n;
            let end = total;

            let indices = BinomialCoefficients.unrankLex(n, k, start, pascalTable);

            const bits = new Uint8Array(n);
            const weights = BinomialCoefficients.bitWeights(n);
            const box = { value: 0n };
            for (let t = 0; t < indices.length; t++) {
                const p = indices[t];
                bits[p] = 1;
                box.value += weights[p];
            }

            for (let r = start; r < end; r++) {
                let oracleResult = false;
                try {
                    oracleResult = oracleFunction(...bits);
                } catch (e) {
                    oracleResult = false;
                    error(e);
                    return;
                }
                if (oracleResult === true || oracleResult === undefined) {
                    yield {
                        value: box.value,
                        bits: includeBits ? bits.join('') : undefined,
                        oracleResponse: oracleResult === true ? true : undefined,
                        rank: r
                    };
                }
                if (r + 1n === end) break;
                if (BinomialCoefficients.nextCombinationAndPatch(indices, n, bits, weights, box) === null) break;
            }
        }

        static filter(n, k, oracleFunction) {
            const result = [];
            for (const item of BinomialCoefficients.filterGenerator(n, k, oracleFunction)) {
                result.push(item);
            }
            return result;
        }

        static getBitString(n, k, i) {
            const pascalTable = BinomialCoefficients.pascalTable(n, k);
            const indices = BinomialCoefficients.unrankLex(n, k, i, pascalTable);
            return BinomialCoefficients.indicesToBits(n, indices).join('');
        }
    }

    class QuineMcCluskey {
        static countSetBits(bitPattern) {
            let count = 0;
            for (let i = 0; i < bitPattern.length; i++) if (bitPattern[i] === '1') count++;
            return count;
        }

        static mergeIfOneBitApart(firstBits, secondBits) {
            if (firstBits.length !== secondBits.length) return null;
            let diffCount = 0;
            const merged = [];
            for (let i = 0; i < firstBits.length; i++) {
                const a = firstBits[i], b = secondBits[i];
                if (a === b) {
                    merged.push(a);
                    continue;
                }
                // Cannot merge if either is already a don't-care
                if (a === '-' || b === '-') return null;
                diffCount++;
                // Only 1 differing bit allowed
                if (diffCount > 1) return null;
                // Mark differing bit as don't-care
                merged.push('-');
            }
            return diffCount === 1 ? merged.join('') : null;
        }

        static mergeOneBitPass(implicants) {
            for (const implicant of implicants) {
                implicant.used = false;
            }

            // Group implicants by number of 1s
            const termsByOneCount = new Map();
            for (const implicant of implicants) {
                const oneCount = QuineMcCluskey.countSetBits(implicant.bits);
                if (!termsByOneCount.has(oneCount)) { // Initialize
                    termsByOneCount.set(oneCount, []);
                }
                termsByOneCount.get(oneCount).push(implicant);
            }

            const sortedWeights = Array.from(termsByOneCount.keys()).sort((a, b) => a - b);
            const mergedTermsByBits = new Map();
            // For each parent term, what children it merged into
            const parentToMergedChildren = new Map();

            const registerParentChild = (parentBits, childTerm) => {
                let arr = parentToMergedChildren.get(parentBits);
                if (!arr) parentToMergedChildren.set(parentBits, (arr = []));
                arr.push(childTerm);
            };

            const recordMergedTerm = (bits, sourceMinterms) => {
                let merged = mergedTermsByBits.get(bits);
                if (!merged) {
                    merged = { bits, minterms: new Set(sourceMinterms), used: false };
                    mergedTermsByBits.set(bits, merged);
                } else {
                    for (const m of sourceMinterms) merged.minterms.add(m);
                }
                return merged;
            };

            for (let i = 0; i < sortedWeights.length - 1; i++) {
                const currentGroup = termsByOneCount.get(sortedWeights[i]);
                const nextGroup = termsByOneCount.get(sortedWeights[i + 1]);
                if (!currentGroup || !nextGroup) continue;
                for (const left of currentGroup) {
                    for (const right of nextGroup) {
                        const mergedBits = QuineMcCluskey.mergeIfOneBitApart(left.bits, right.bits);
                        if (!mergedBits) continue;
                        left.used = right.used = true;
                        const combinedMinterms = new Set(left.minterms);
                        for (const m of right.minterms) combinedMinterms.add(m);
                        const child = recordMergedTerm(mergedBits, combinedMinterms);
                        registerParentChild(left.bits, child);
                        registerParentChild(right.bits, child);
                    }
                }
            }

            return {
                mergedTermsNextLevel: Array.from(mergedTermsByBits.values()),
                primeTermsThisLevel: implicants.filter(t => !t.used),
                parentToMergedChildren
            };
        }

        static buildImplicantLevels(initialImplicants) {
            const levels = [];
            let currentLevelImplicants = initialImplicants;
            while (currentLevelImplicants.length) {
                // One expansion step
                const mergePass = QuineMcCluskey.mergeOneBitPass(currentLevelImplicants);
                // Collect prime implicants from this level (terms that did not merge further)
                const primeImplicantBits = new Set(mergePass.primeTermsThisLevel.map(t => t.bits));
                levels.push({
                    terms: currentLevelImplicants.slice().sort((a, b) => a.bits.localeCompare(b.bits)),
                    primeSet: primeImplicantBits
                });
                if (!mergePass.mergedTermsNextLevel.length) break;
                currentLevelImplicants = mergePass.mergedTermsNextLevel;
            }
            return levels;
        }

        // Extract minterms and don't-cares using the oracle. Verbose mode also constructs the initial implicant merge levels
        // Output: { minterms, dontCares, variableCount }
        static enumerateMintermsAndDontCares(numVariables, oracleFunction, verbose = true) {
            const minterms = [];
            const dontCares = [];

            // High-performing path
            if (!verbose) {
                for (let weight = 0; weight <= numVariables; weight++) {
                    for (const item of BinomialCoefficients.filterGenerator(numVariables, weight, oracleFunction)) {
                        const valueNum = Number(item.value);
                        if (item.oracleResponse === true) {
                            minterms.push(valueNum);
                        } else {
                            dontCares.push(valueNum);
                        }
                    }
                }
                return { minterms, dontCares, variableCount: numVariables };
            }

            // Verbose path
            const outputArea = document.getElementById('output');
            outputArea.value = 'Number of variables: ' + numVariables + '\n\n';

            const mintermRowsByWeight = new Map();
            let previousWeightImplicants = null;
            let previousRowByBitsMap = null;
            const firstLevelMergedTermsByBits = new Map();

            const recordFirstLevelMerged = (bits, sourceMinterms) => {
                let term = firstLevelMergedTermsByBits.get(bits);
                if (!term) {
                    term = { bits, minterms: new Set(sourceMinterms), used: false };
                    firstLevelMergedTermsByBits.set(bits, term);
                } else {
                    for (const m of sourceMinterms) {
                        term.minterms.add(m);
                    }
                }
            };

            // Remove duplicate terms based on bit pattern
            const dedupeTermsByBits = terms => {
                const seen = new Set();
                const unique = [];
                for (const t of terms) {
                    if (!seen.has(t.bits)) {
                        seen.add(t.bits);
                        unique.push(t);
                    }
                }
                return unique;
            };

            // Generate implicants for each weight (number of 1s)
            for (let weight = 0; weight <= numVariables; weight++) {
                const weightImplicants = [];
                const weightRows = [];
                const rowByBitsMap = new Map();

                for (const item of BinomialCoefficients.filterGenerator(numVariables, weight, oracleFunction)) {
                    const bitPattern = item.bits;
                    const numericValue = Number(item.value);
                    if (item.oracleResponse === true) {
                        minterms.push(numericValue);
                    } else {
                        dontCares.push(numericValue);
                    }
                    const isMinterm = (item.oracleResponse === true);
                    const implicant = { bits: bitPattern, minterms: new Set(isMinterm ? [numericValue] : []), used: false };
                    weightImplicants.push(implicant);
                    const mintermRow = { bits: bitPattern, mintermVal: isMinterm ? numericValue : null, size2MergedChildren: [] };
                    weightRows.push(mintermRow);

                    rowByBitsMap.set(bitPattern, mintermRow);
                }

                // Try merging current weight with previous weight (diff of one 1)
                if (previousWeightImplicants) {
                    for (const previousImplicant of previousWeightImplicants) {
                        for (const currentImplicant of weightImplicants) {
                            const mergedBits = QuineMcCluskey.mergeIfOneBitApart(previousImplicant.bits, currentImplicant.bits);
                            if (!mergedBits) continue;
                            previousImplicant.used = currentImplicant.used = true;
                            const unionMinterms = new Set(previousImplicant.minterms);
                            for (const minterm of currentImplicant.minterms) {
                                unionMinterms.add(minterm);
                            }
                            recordFirstLevelMerged(mergedBits, unionMinterms);
                            const childTerm = { bits: mergedBits, minterms: unionMinterms, used: false };
                            const previousRow = previousRowByBitsMap.get(previousImplicant.bits);
                            if (previousRow) previousRow.size2MergedChildren.push(childTerm);
                            const currentRow = rowByBitsMap.get(currentImplicant.bits);
                            if (currentRow) currentRow.size2MergedChildren.push(childTerm);
                        }
                    }
                }

                previousWeightImplicants = weightImplicants;
                previousRowByBitsMap = rowByBitsMap;
                mintermRowsByWeight.set(weight, weightRows);
            }

            const firstLevelTerms = Array.from(firstLevelMergedTermsByBits.values()).sort((a, b) => a.bits.localeCompare(b.bits));
            const implicantLevels = QuineMcCluskey.buildImplicantLevels(firstLevelTerms);

            if (!implicantLevels.length) {
                outputArea.value += 'No implicants produced.\n';
                return { minterms, dontCares, variableCount: numVariables };
            }

            // Prime implicants after first merge from size 2 and size 4 levels
            const primeSize2Set = implicantLevels[0]?.primeSet || new Set();
            const firstSize2MergePass = QuineMcCluskey.mergeOneBitPass(firstLevelTerms);
            const primeSize4Set = implicantLevels[1]?.primeSet || new Set();
            const size2TermToSize4Children = firstSize2MergePass.parentToMergedChildren || new Map();

            const formatImplicant = (term, primeSet) => {
                if (!term) return '-';
                const mintermList = Array.from(term.minterms).sort((a, b) => a - b);
                const label = mintermList.length ? 'm(' + mintermList.join(',') + ')' : '-';
                return label + '\t' + term.bits + (primeSet.has(term.bits) ? ' *' : '');
            };

            outputArea.value += 'Number of 1s\tMinterm\t0-Cube\tSize 2 Implicants\n';
            const sortedWeights = Array.from(mintermRowsByWeight.keys()).sort((a, b) => a - b);
            for (const weight of sortedWeights) {
                const rows = mintermRowsByWeight.get(weight) || [];
                let printedWeight = false;
                for (const row of rows) {
                    const size2Implicants = dedupeTermsByBits(row.size2MergedChildren);
                    const linesPerRow = Math.max(1, size2Implicants.length);
                    for (let i = 0; i < linesPerRow; i++) {
                        outputArea.value +=
                            (printedWeight ? '' : weight) + '\t' +
                            (i === 0 ? (row.mintermVal !== null ? 'm' + row.mintermVal : '-') : '-') + '\t' +
                            (i === 0 ? row.bits : '-') + '\t' +
                            formatImplicant(size2Implicants[i] || null, primeSize2Set) + '\n';
                        printedWeight = true;
                    }
                }
            }
            outputArea.value += '\n';

            outputArea.value += 'Number of 1s\tMinterm\t0-Cube\tSize 2 Implicants\tSize 4 Implicants\n';
            for (const weight of sortedWeights) {
                const rows = mintermRowsByWeight.get(weight) || [];
                let printedWeight = false;
                for (const row of rows) {
                    const size2Implicants = dedupeTermsByBits(row.size2MergedChildren);
                    const linesPerRow = Math.max(1, size2Implicants.length);
                    for (let i = 0; i < linesPerRow; i++) {
                        const size2Imp = size2Implicants[i] || null;
                        const size4Imp = size2Imp ? (size2TermToSize4Children.get(size2Imp.bits) || [])[0] || null : null;
                        outputArea.value +=
                            (printedWeight ? '' : weight) + '\t' +
                            (i === 0 ? (row.mintermVal !== null ? 'm' + row.mintermVal : '-') : '-') + '\t' +
                            (i === 0 ? row.bits : '-') + '\t' +
                            formatImplicant(size2Imp, primeSize2Set) + '\t' +
                            formatImplicant(size4Imp, primeSize4Set) + '\n';
                        printedWeight = true;
                    }
                }
            }
            outputArea.value += '\n';

            return { minterms, dontCares, variableCount: numVariables };
        }
    }

    function error(e) {
        console.log('Erroring:', e);
        const outputArea = document.getElementById('output');
        outputArea.value += 'ERROR: ' + e.message + '\n';
    }

    function run() {
        const oldScript = document.getElementById('insert-oracle');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        const oracleCode = document.getElementById('oracle').value;
        script.id = 'insert-oracle';
        script.textContent = oracleCode;
        document.body.appendChild(script);

        const oracleHeader = window.oracle.toString().match(/\(([^)]+)\)/);
        const numVariables = oracleHeader ? oracleHeader[1].split(',').length : 0;

        QuineMcCluskey.enumerateMintermsAndDontCares(numVariables, window.oracle, true);
    }

    console.error = function (e) {
        error(e);
    };
</script>

<script id='insert-oracle' type='text/javascript'></script>

</html>
