function oracle(A, B, C, D) {
    const t1 = (((D & 1) | ((B ^ 1) & D)) ^ 1);
    const t2 = (A & (B | (B ^ 1)));
    const t3 = (A & (C ^ 1));
    const t4 = (A & C);
    const t5 = ((D ^ 1) & B & (B ^ 1));
    const t6 = (D & 0);
    const t7 = (((B & 0) | ((B ^ 1) & 0)) & D);
    const value = t1 | t2 | t3 | t4 | t5 | t6 | t7;
    return !!value;

    // Wikipedia Example
    const n = [A, B, C, D].reduce((index, bit) => index * 2 + (bit ? 1 : 0), 0); // Pack boolean inputs into an integer index
    if ([4, 8, 10, 11, 12, 15].includes(n)) return true;
    if ([9, 14].includes(n)) return undefined; // Don't cares
    return false;
}</textarea>

<script>
    'use strict';

    let variableNames = [], usedVariableNames = [], outputTableNeedsUpdate = true;

    class BinomialCoefficients {
        static pascalTableCache = new Map();
        static bitWeightsCache = new Map();

        // Generate Pascal's triangle table for binomial coefficients (BigInt)
        static pascalTable(n, k) {
            const key = n + '|' + k;
            const cached = BinomialCoefficients.pascalTableCache.get(key);
            if (cached) return cached;
            const table = Array.from({ length: n + 1 }, () => Array(k + 1).fill(0n));
            for (let i = 0; i <= n; i++) {
                table[i][0] = 1n;
                for (let j = 1; j <= Math.min(i, k); j++) {
                    table[i][j] = (j === i) ? 1n : table[i - 1][j - 1] + table[i - 1][j];
                }
            }
            BinomialCoefficients.pascalTableCache.set(key, table);
            return table;
        }

        static bitWeights(n) {
            const hit = BinomialCoefficients.bitWeightsCache.get(n);
            if (hit) return hit;
            const weights = Array.from({ length: n }, (_, i) => 1n << BigInt(n - 1 - i));
            BinomialCoefficients.bitWeightsCache.set(n, weights);
            return weights;
        }

        static unrankLex(n, k, rank, pascalTable) {
            let remainingRank = BigInt(rank);
            const indices = new Array(k);
            let start = 0;
            for (let placed = 0; placed < k; placed++) {
                const remaining = k - placed - 1;
                let lo = start, hi = n - (remaining + 1), ans = start;
                while (lo <= hi) {
                    const mid = Math.floor((lo + hi) / 2);
                    const count = pascalTable[n - (mid + 1)][remaining];
                    if (count > remainingRank) { ans = mid; hi = mid - 1; }
                    else { remainingRank -= count; lo = mid + 1; }
                }
                indices[placed] = ans;
                start = ans + 1;
            }
            return indices;
        }

        static nextCombination(indices, n) {
            const k = indices.length;
            let i = k - 1;
            while (i >= 0 && indices[i] === i + (n - k)) i--;
            if (i < 0) return null;
            indices[i]++;
            for (let j = i + 1; j < k; j++) {
                indices[j] = indices[j - 1] + 1;
            }
            return indices;
        }

        static nextCombinationAndPatch(indices, n, bits, weights, box) {
            const k = indices.length;
            let i = k - 1;
            while (i >= 0 && indices[i] === i + (n - k)) i--;
            if (i < 0) return null;
            for (let j = k - 1; j >= i; j--) {
                const pos = indices[j];
                if (bits[pos] === 1) {
                    bits[pos] = 0;
                    box.value -= weights[pos];
                }
            }
            indices[i]++;
            bits[indices[i]] = 1;
            box.value += weights[indices[i]];
            for (let j = i + 1; j < k; j++) {
                indices[j] = indices[j - 1] + 1;
                bits[indices[j]] = 1;
                box.value += weights[indices[j]];
            }
            return indices;
        }

        static indicesToBits(n, indices) {
            const bits = Array(n).fill(0);
            for (let i = 0; i < indices.length; i++) bits[indices[i]] = 1;
            return bits;
        }

        // Generator: yield combinations passing oracle filter
        static *filterGenerator(n, k, oracleFunction) {
            const includeBits = true;
            const pascalTable = BinomialCoefficients.pascalTable(n, k);
            const total = pascalTable[n][k];
            if (k < 0 || k > n || total === 0n) return;

            let start = 0n;
            let end = total;

            let indices = BinomialCoefficients.unrankLex(n, k, start, pascalTable);

            const bits = new Uint8Array(n);
            const weights = BinomialCoefficients.bitWeights(n);
            const box = { value: 0n };
            for (let t = 0; t < indices.length; t++) {
                const p = indices[t];
                bits[p] = 1;
                box.value += weights[p];
            }

            for (let r = start; r < end; r++) {
                let oracleResult = false;
                try {
                    oracleResult = oracleFunction(...Array.from(bits, b => b === 1));
                } catch (e) {
                    oracleResult = false;
                    error(e);
                    return;
                }
                if (oracleResult === true || oracleResult === undefined) {
                    yield {
                        value: box.value,
                        bits: includeBits ? bits.join('') : undefined,
                        oracleResponse: oracleResult === true ? true : undefined,
                        rank: r
                    };
                }
                if (r + 1n === end) break;
                if (BinomialCoefficients.nextCombinationAndPatch(indices, n, bits, weights, box) === null) break;
            }
        }

        static filter(n, k, oracleFunction) {
            const result = [];
            for (const item of BinomialCoefficients.filterGenerator(n, k, oracleFunction)) {
                result.push(item);
            }
            return result;
        }

        static getBitString(n, k, i) {
            const pascalTable = BinomialCoefficients.pascalTable(n, k);
            const indices = BinomialCoefficients.unrankLex(n, k, i, pascalTable);
            return BinomialCoefficients.indicesToBits(n, indices).join('');
        }
    }

    class QuineMcCluskey {

        static defaultVarNames(n) {
            const out = [];
            for (let i = 0; i < n; i++) {
                let s = '', x = i;
                while (x >= 0) {
                    const rem = x % 26;
                    s = String.fromCharCode(65 + rem) + s;
                    x = Math.floor(x / 26) - 1;
                }
                out.push(s);
            }
            return out;
        }

        static toBitString(n, value) {
            return value.toString(2).padStart(n, '0');
        }

        static countSetBits(bitPattern) {
            let count = 0;
            for (let i = 0; i < bitPattern.length; i++) if (bitPattern[i] === '1') count++;
            return count;
        }

        static getEssentialPrimeImplicants(chart) {
            const coverageRows = [...chart.values()];
            const implicantPatterns = [...chart.keys()];
            if (!coverageRows.length) return [];
            const columnCount = coverageRows[0].length;
            const essentialPatterns = new Set();

            for (let colIndex = 0; colIndex < columnCount; colIndex++) {
                let implicantCoverCount = 0;
                let lastCoveringRowIndex = -1;

                for (let rowIndex = 0; rowIndex < coverageRows.length; rowIndex++) {
                    if (coverageRows[rowIndex][colIndex] === '1') {
                        implicantCoverCount++;
                        lastCoveringRowIndex = rowIndex;
                        if (implicantCoverCount > 1) break;
                    }
                }
                if (implicantCoverCount === 1) {
                    essentialPatterns.add(implicantPatterns[lastCoveringRowIndex]);
                }
            }
            return [...essentialPatterns];
        }

        static mergeIfOneBitApart(firstBits, secondBits) {
            if (firstBits.length !== secondBits.length) return null;
            let diffCount = 0;
            const merged = [];
            for (let i = 0; i < firstBits.length; i++) {
                const a = firstBits[i], b = secondBits[i];
                if (a === b) {
                    merged.push(a);
                    continue;
                }
                if (a === '-' || b === '-') return null;
                diffCount++;
                if (diffCount > 1) return null;
                merged.push('-');
            }
            return diffCount === 1 ? merged.join('') : null;
        }

        static mergeOneBitPass(implicants) {
            for (const implicant of implicants) implicant.used = false;

            const termsByOneCount = new Map();
            for (const implicant of implicants) {
                const oneCount = QuineMcCluskey.countSetBits(implicant.bits);
                if (!termsByOneCount.has(oneCount)) termsByOneCount.set(oneCount, []);
                termsByOneCount.get(oneCount).push(implicant);
            }

            const sortedWeights = Array.from(termsByOneCount.keys()).sort((a, b) => a - b);
            const mergedTermsByBits = new Map();
            const parentToMergedChildren = new Map();

            const registerParentChild = (parentBits, childTerm) => {
                let arr = parentToMergedChildren.get(parentBits);
                if (!arr) parentToMergedChildren.set(parentBits, (arr = []));
                arr.push(childTerm);
            };

            const recordMergedTerm = (bits, sourceMinterms) => {
                let merged = mergedTermsByBits.get(bits);
                if (!merged) {
                    merged = { bits, minterms: new Set(sourceMinterms), used: false };
                    mergedTermsByBits.set(bits, merged);
                } else {
                    for (const m of sourceMinterms) merged.minterms.add(m);
                }
                return merged;
            };

            for (let i = 0; i < sortedWeights.length - 1; i++) {
                const currentGroup = termsByOneCount.get(sortedWeights[i]);
                const nextGroup = termsByOneCount.get(sortedWeights[i + 1]);
                if (!currentGroup || !nextGroup) continue;
                for (const left of currentGroup) {
                    for (const right of nextGroup) {
                        const mergedBits = QuineMcCluskey.mergeIfOneBitApart(left.bits, right.bits);
                        if (!mergedBits) continue;
                        left.used = right.used = true;
                        const combinedMinterms = new Set(left.minterms);
                        for (const m of right.minterms) combinedMinterms.add(m);
                        const child = recordMergedTerm(mergedBits, combinedMinterms);
                        registerParentChild(left.bits, child);
                        registerParentChild(right.bits, child);
                    }
                }
            }

            return {
                mergedTermsNextLevel: Array.from(mergedTermsByBits.values()),
                primeTermsThisLevel: implicants.filter(t => !t.used),
                parentToMergedChildren
            };
        }

        static buildImplicantLevels(initialImplicants) {
            const levels = [];
            let currentLevelImplicants = initialImplicants;
            while (currentLevelImplicants.length) {
                const mergePass = QuineMcCluskey.mergeOneBitPass(currentLevelImplicants);
                const primeImplicantBits = new Set(mergePass.primeTermsThisLevel.map(t => t.bits));
                levels.push({
                    terms: currentLevelImplicants.slice().sort((a, b) => a.bits.localeCompare(b.bits)),
                    primeSet: primeImplicantBits
                });
                if (!mergePass.mergedTermsNextLevel.length) break;
                currentLevelImplicants = mergePass.mergedTermsNextLevel;
            }
            return levels;
        }

        static solve(numVariables, oracleFunction, variableNames, form='dnf') {
            const minterms = [];
            const initialImplicants = [];

            for (let weight = 0; weight <= numVariables; weight++) {
                for (const item of BinomialCoefficients.filterGenerator(numVariables, weight, oracleFunction)) {
                    const bitPattern = item.bits;
                    const numericValue = Number(item.value);
                    const isMinterm = (item.oracleResponse === true);
                    if (isMinterm) minterms.push(numericValue);
                    initialImplicants.push({
                        bits: bitPattern,
                        minterms: new Set(isMinterm ? [numericValue] : []),
                        used: false
                    });
                }
            }

            const implicantLevels = QuineMcCluskey.buildImplicantLevels(initialImplicants);

            const allPrimeBits = new Set();
            for (const lvl of implicantLevels) {
                for (const b of lvl.primeSet) allPrimeBits.add(b);
            }
            const primeImplicantsBits = Array.from(allPrimeBits).sort();

            const mintermsSorted = [...minterms].sort((a, b) => a - b);
            const mintermBinaryStrings = mintermsSorted.map(v => QuineMcCluskey.toBitString(numVariables, v));
            const coverageChart = new Map();
            for (const implicantPattern of primeImplicantsBits) {
                const patternRegex = new RegExp('^' + implicantPattern.replace(/-/g, '[01]') + '$');
                const coverageBits = mintermBinaryStrings.map(binStr => (patternRegex.test(binStr) ? '1' : '0')).join('');
                coverageChart.set(implicantPattern, coverageBits);
            }

            const essentialBits = new Set(QuineMcCluskey.getEssentialPrimeImplicants(coverageChart));

            const productFromPattern = (pattern) => {
                const jsTokens = [];
                for (let i = 0; i < pattern.length; i++) {
                    const bit = pattern[i];
                    if (bit === '-') continue;
                    const varName = variableNames[i] || ('V' + i);
                    jsTokens.push(bit === '1' ? varName : '!' + varName);
                }
                if (!jsTokens.length) return 'true';
                if (jsTokens.length === 1) return jsTokens[0];
                return jsTokens.join(' && ');
            };

            const primeImplicantsExpanded = primeImplicantsBits.map(pattern => {
                const coverageBits = coverageChart.get(pattern) || '';
                const covers = [];
                for (let i = 0; i < coverageBits.length; i++) {
                    if (coverageBits[i] === '1') covers.push(mintermsSorted[i]);
                }
                return {
                    pattern,
                    jsExpression: productFromPattern(pattern),
                    covers,
                    essential: essentialBits.has(pattern)
                };
            }).sort((a, b) => a.pattern.localeCompare(b.pattern));

            const essentialExpanded = primeImplicantsExpanded.filter(pi => pi.essential);
            const jsExpression = essentialExpanded.length ? essentialExpanded.map(pi => pi.jsExpression).join(' || ') : 'false';

            // Also generate SAT instance in DIMACS DNF format
            const varCount = variableNames.length;
            const clauses = essentialExpanded.map(pi => {
                const lits = [];
                for (let i = 0; i < pi.pattern.length; i++) {
                    if (pi.pattern[i] === '-') continue;
                    const idx = i + 1;
                    lits.push(pi.pattern[i] === '1' ? idx : -idx);
                }
                return lits.join(' ') + ' 0';
            });
            const dnfCode =
                `p dnf ${varCount} ${clauses.length}\n` +
                clauses.join('\n');

            return {
                js: jsExpression,
                sat: dnfCode
            };

            // // Also generate SAT instance in DIMACS CNF format
            // const varCount = variableNames.length;
            // const clauses = essentialExpanded.map(pi => {
            //     const lits = [];
            //     for (let i = 0; i < pi.pattern.length; i++) {
            //         if (pi.pattern[i] === '-') continue;
            //         const idx = i + 1;
            //         lits.push(pi.pattern[i] === '1' ? idx : -idx);
            //     }
            //     return lits.join(' ') + ' 0';
            // });
            // const satCode =
            //     `p cnf ${varCount} ${clauses.length}\n` +
            //     clauses.join('\n');

            // return {
            //     js: jsExpression,
            //     sat: satCode
            // };
        }
    }

    function error(e) {
        console.log('Erroring:', e);
        const outputArea = document.getElementById('output-code');
        outputArea.value += 'ERROR: ' + e.message + '\n';
    }

    console.error = function (e) {
        error(e);
    };

    function applyInputOracleScript(type) {
        const oldScript = document.getElementById('insert-oracle');
        if (oldScript) oldScript.remove();

        if (type === undefined) {
            if (document.getElementById('inputCode').checked) type = 'code';
            else if (document.getElementById('inputTruthTable').checked) type = 'table';
            else if (document.getElementById('inputSATInstance').checked) type = 'sat';
            else type = 'code';
        }

        const script = document.createElement('script');
        let oracleCode = '';
        if (type === 'code') {
            oracleCode = editorCode.getValue();
        } else if (type === 'table') {
            oracleCode = generateTruthTableCode();
        } else if (type === 'sat') {
            oracleCode = generateSATInstanceCode();
        }
        script.id = 'insert-oracle';
        script.textContent = oracleCode;
        script.onerror = (e) => {
            error(e);
        };
        window.oracle = null;
        document.body.appendChild(script);

        if (typeof window.oracle !== 'function') {
            error(new Error('Oracle function not defined'));
            return false;
        }
        return true;
    }

    function applyOutputOracleScript() {
        const oldScript = document.getElementById('insert-oracle');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        const oracleCode = outputCode.getValue();
        script.id = 'insert-oracle';
        script.textContent = oracleCode;
        script.onerror = (e) => {
            error(e);
        };
        window.oracle = null;
        document.body.appendChild(script);

        if (typeof window.oracle !== 'function') {
            error(new Error('Oracle function not defined'));
            return false;
        }
        return true;
    }

    function copyOutputToInput() {

        if (document.getElementById('inputCode').checked) {
            editorCode.setValue(outputCode.getValue());
            variableNames = usedVariableNames.slice();
            showInputTab('code');
        } else if (document.getElementById('inputTruthTable').checked) {
            showInputTab('table');
            inputTruthTableVariableNames = variableNames.slice();
            restoreInputTable();
        } else if (document.getElementById('inputSATInstance').checked) {
            editorSat.setValue(outputSat.getValue());
            showInputTab('sat');
        }
    }

    function run() {
        if (!applyInputOracleScript()) return;

        // Extract the input argument names
        const oracleHeader = window.oracle.toString().match(/\(([^)]*)\)/);
        const paramList = oracleHeader ? oracleHeader[1] : '';
        const parsedNames = paramList.split(',').map(s => s.trim()).filter(Boolean);
        variableNames = (parsedNames.length ? parsedNames : QuineMcCluskey.defaultVarNames(parsedNames.length));

        const { js: expression, sat: satCode } = QuineMcCluskey.solve(parsedNames.length, window.oracle, variableNames, true);
        outputSat.setValue(satCode);

        // Collect used vars from expression
        const identifierRegex = /\b[A-Za-z_][A-Za-z0-9_]*\b/g;
        const used = new Set();
        let match;
        while ((match = identifierRegex.exec(expression)) !== null) {
            const name = match[0];
            // Filter to original vars (skip literals)
            if (variableNames.includes(name) && name !== 'true' && name !== 'false') {
            used.add(name);
            }
        }
        // Only keep used variable names
        usedVariableNames = variableNames.filter(v => used.has(v));
        const funcArgs = usedVariableNames.join(',');
        const funcBody = 'return ' + expression + ';';
        const finalFunction = 'function oracle(' + funcArgs + ') {\n  ' + funcBody + '\n}';
        outputCode.setValue(finalFunction);
        console.log('Minimized function:', finalFunction);

        outputTableNeedsUpdate = true;
        if (document.getElementById('outputTruthTable').checked) {
            setupOutputTable();
        }

        document.getElementById('copyButton').disabled = false;
    }
</script>

<script id='insert-oracle' type='text/javascript'></script>

<script>
    let editorCode, editorSat, outputCode, outputSat;

    // Setup CodeMirror editors
    function setupSampleCodeEditors() {
        const optionsOracleCode = {
            autofocus: false,
            autohint: true,
            dragDrop: false,
            lineNumbers: true,
            lineWrapping: true,
            lineWiseCopyCut: true,

            lint: {
                esversion: 11
            },
            gutters: ['CodeMirror-lint-markers'],
            lintOnChange: true,

            },

            undoDepth: 1000,

            highlightSelectionMatches: true,

        };

        const optionsSAT = {
            autofocus: false,
            autohint: true,
            dragDrop: false,
            lineNumbers: true,
            lineWrapping: true,
            lineWiseCopyCut: true,
            readOnly: false,
            theme: 'material-darker',

        };

        const optionsOutputCode = { ...optionsOracleCode, readOnly: true };

    // Format the code editors
	function formatCodeEditors() {
		editorCode.autoFormatRange({ line: 0, ch: 0 }, { line: editorCode.lineCount() });
        editorSat.autoFormatRange({ line: 0, ch: 0 }, { line: editorSat.lineCount() });
		outputCode.autoFormatRange({ line: 0, ch: 0 }, { line: outputCode.lineCount() });
        outputSat.autoFormatRange({ line: 0, ch: 0 }, { line: outputSat.lineCount() });

    let truthTableValues = [], inputTruthTableVariableNames = [];

    function updateTableVariableList() {
        const input = document.getElementById('variable-list');
        const text = input.value;
        const names = text.split(',').map(s => s.trim()).filter(Boolean);
        if (names.length) {
            inputTruthTableVariableNames = names;
        } else {
            inputTruthTableVariableNames = QuineMcCluskey.defaultVarNames(inputTruthTableVariableNames.length || 4);
            input.value = inputTruthTableVariableNames.join(',');
        }
        const container = document.getElementById('oracle-table');
        if (!applyInputOracleScript('code')) {
            alert('Cannot setup table: Oracle function not defined');
            return;
        }
        setupTable(container, inputTruthTableVariableNames, false);
    }

    function restoreInputTable() {
        const input = document.getElementById('variable-list');
        if (variableNames.length) {
            input.value = variableNames.join(',');
            inputTruthTableVariableNames = [...variableNames];
        } else {
            inputTruthTableVariableNames = QuineMcCluskey.defaultVarNames(inputTruthTableVariableNames.length || 4);
            input.value = inputTruthTableVariableNames.join(',');
        }
        const container = document.getElementById('oracle-table');
        if (!applyInputOracleScript('code')) {
            alert('Cannot setup table: Oracle function not defined');
            return;
        }
        setupTable(container, inputTruthTableVariableNames, false);
    }

    function setupOutputTable() {
        if (!outputTableNeedsUpdate) return;
        const container = document.getElementById('output-table');
        if (!applyOutputOracleScript('code')) {
            return;
        }
        setupTable(container, usedVariableNames, true);
        outputTableNeedsUpdate = false;
        console.log('Output table set up with', usedVariableNames.length, 'variables');
    }

    function setupTable(container, variableNames, readonly) {
        container.classList.add('ht-theme-main');

        if (container._handsontableInstance) {
            container._handsontableInstance.destroy();
            container._handsontableInstance = null;
        }
        container.innerHTML = '';

        const headers = [...variableNames, 'Result'];
        const numVars = variableNames.length;
        const rowCount = 1 << numVars;

        truthTableValues = []; // Reset before filling

        const data = Array.from({ length: rowCount }, (_, idx) => {
            const row = [];
            for (let bit = numVars - 1; bit >= 0; bit--) {
                row.push((idx >> bit) & 1);
            }
            let result;
            try {
                result = window.oracle(...row.map(Boolean));
            } catch (e) {
                result = 'ERROR: ' + e.message;
            }
            const resultValue = result === undefined ? '' : +!!result;
            row.push(resultValue);
            truthTableValues.push(resultValue);
            return row;
        });

        const columns = Array.from({ length: variableNames.length }, () => ({
            type: 'numeric',
            className: 'htCenter htMiddle',
            readOnly: true
        }));
        columns.push({ type: 'numeric', className: 'htCenter htMiddle' });
        const enableRowHeader = true;
        const rowHeaderWidth = enableRowHeader ? 20 : 0;
        const baseColWidth = 60;
        const scrollbarWidth = 16;
        const minTableWidth = rowHeaderWidth + (variableNames.length + 1) * baseColWidth + scrollbarWidth;
        let width = container.clientWidth || (container.parentElement && container.parentElement.clientWidth) || minTableWidth;
        width = Math.max(width, minTableWidth);
        if (container.clientWidth) {
            width = Math.min(width, container.clientWidth);
        }

        let colWidths = Array(variableNames.length).fill(baseColWidth);
        let resultColWidth = width - rowHeaderWidth - scrollbarWidth - (variableNames.length * baseColWidth);
        resultColWidth = Math.max(resultColWidth, baseColWidth);
        // resultColWidth = Math.max(resultColWidth, baseColWidth * 2);
        colWidths.push(resultColWidth);

        // Set table height: scale for small values, max 360
        let tableHeight = Math.min(360, 32 + rowCount * 24);

        let options = {
            data,
            columns,
            colHeaders: headers,
            rowHeaders: enableRowHeader,
            rowHeaderWidth: enableRowHeader ? rowHeaderWidth : undefined, // <-- set row header width here
            colWidths: colWidths,
            stretchH: 'none',
            height: tableHeight,
            width: width,
            autoWrapRow: false,
            autoWrapCol: false,
            contextMenu: false,
            licenseKey: 'non-commercial-and-evaluation'
        }
        
        if (readonly) {
            options.readOnly = true;
        } else {
            options.readOnly = false;
            
            // Only allow selection of the result column
            options.beforeSetRangeStart = function(coords) {
                if (coords.col !== variableNames.length) {
                    coords.col = variableNames.length;
                }
            };
            options.beforeSetRangeEnd = function(coords) {
                if (coords.col !== variableNames.length) {
                    coords.col = variableNames.length;
                }
            };
            // Make variable columns read-only and custom renderer for result column
            options.cells = function(row, col) {
                if (col !== variableNames.length) {
                    return { readOnly: true };
                }
            };

            // Store last selection for bulk edit
            options.afterSelectionEnd = function (rowStart, colStart, rowEnd, colEnd) {
                this._lastSelection = { rowStart, colStart, rowEnd, colEnd };
            };

            // Handle result column changes and bulk fill
            options.afterChange = function(changes, source) {
                if (!changes) return;
                const hotInstance = this;
                const resultCol = variableNames.length;
                for (const [row, col, oldValue, newValue] of changes) {
                    if (col !== resultCol) continue;

                    let val;
                    if (newValue === '' || newValue === null || newValue === undefined) {
                        val = '';
                    } else if (
                        newValue === 1 || newValue === true || (typeof newValue === 'string' && /^(1|t|true|y|yes)$/i.test(newValue.trim()))) {
                        val = 1;
                    } else if (
                        newValue === 0 || newValue === false || (typeof newValue === 'string' && /^(0|f|false|n|no)$/i.test(newValue.trim()))) {
                        val = 0;
                    } else {
                        val = '';
                    }
                    truthTableValues[row] = val;
                    const display = val;

                    // Bulk fill for selection
                    if (source === 'edit' && hotInstance._lastSelection) {
                        const { rowStart, rowEnd, colStart, colEnd } = hotInstance._lastSelection;
                        if (colStart === resultCol && colEnd === resultCol) {
                            const r1 = Math.min(rowStart, rowEnd), r2 = Math.max(rowStart, rowEnd);
                            for (let r = r1; r <= r2; r++) {
                            if (r === row) continue;
                                hotInstance.setDataAtCell(r, resultCol, display, 'bulkFill');
                                truthTableValues[r] = val;
                            }
                        }
                    }

                    if (hotInstance.getDataAtCell(row, col) !== display) {
                        hotInstance.setDataAtCell(row, col, display, 'internal');
                    }
                }
            };
        }

        const hot = new Handsontable(container, options);
        container._handsontableInstance = hot;
    }

    function fillTruthTableSelection(value) {
        const container = document.getElementById('oracle-table');
        const hot = container._handsontableInstance;
        if (!hot) return;

        const resultCol = inputTruthTableVariableNames.length;
        // Use last selection if available, otherwise select all rows in result column
        let sel;
        if (hot._lastSelection) {
            sel = hot._lastSelection;
        } else {
            sel = {
                rowStart: 0,
                rowEnd: hot.countRows() - 1,
                colStart: resultCol,
                colEnd: resultCol
            };
        }
        const startRow = Math.min(sel.rowStart, sel.rowEnd);
        const endRow = Math.max(sel.rowStart, sel.rowEnd);
        for (let row = startRow; row <= endRow; row++) {
            hot.setDataAtCell(row, resultCol, value, 'bulkFill');
        }
        // Restore selection
        hot.selectCell(sel.rowStart, sel.colStart, sel.rowEnd, sel.colEnd, false, false);
        hot._lastSelection = sel;
    }

    function generateTruthTableCode() {
        const varList = inputTruthTableVariableNames.join(', ');
        const valuesArray = JSON.stringify(truthTableValues);
        return `function oracle(${varList}) {
    const values = ${valuesArray};
    const index = [${inputTruthTableVariableNames.join(', ')}].reduce((acc, val) => acc * 2 + (val ? 1 : 0), 0);
    const v = values[index];
    if (v === 1 || v === '1') return true;
    if (v === 0 || v === '0') return false;
    return undefined;
}`;
    }
    // Parse SAT instance from editor and generate an oracle function
    function generateSATInstanceCode() {
        const raw = editorSat.getValue();
        const lines = raw.split(/\r?\n/);

        let declaredVars = 0, declaredClauses = 0;
        let format = 'cnf';
        const clauses = [];
        let maxVar = 0;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line || line.startsWith('c')) continue;
            if (line.startsWith('p')) {
                // Parse problem line: e.g. "p cnf 5 6"
                const match = /^p\s+(cnf|dnf)\s+(\d+)\s+(\d+)/i.exec(line);
                if (match) {
                    format = match[1].toLowerCase();
                    declaredVars = parseInt(match[2], 10);
                    declaredClauses = parseInt(match[3], 10);
                }
                continue;
            }
            // Parse clause literals
            const nums = line.split(/\s+/).map(Number).filter(n => !Number.isNaN(n));
            if (!nums.length) continue;

            let clause = [];
            for (const lit of nums) {
                if (lit === 0) {
                    // End of clause
                    if (clause.length) {
                        clauses.push(clause);
                        clause = [];
                    }
                    continue;
                }
                maxVar = Math.max(maxVar, Math.abs(lit));
                clause.push(lit);
            }
            if (clause.length) clauses.push(clause);
        }

        // Use declared variable count or max seen
        const varCount = declaredVars || maxVar;
        if (!varCount) throw new Error('SAT instance has no variables.');

        const paramNames = QuineMcCluskey.defaultVarNames(varCount);

        let jsClauses = [];
        let body = '';

        // Convert SAT clauses to JS logic
        if (format === 'dnf') {
            for (const clause of clauses) {
                if (clause.length) {
                    const parts = clause.map(lit => {
                        const idx = Math.abs(lit) - 1;
                        const v = paramNames[idx];
                        return lit > 0 ? v : '!' + v;
                    });
                    jsClauses.push('(' + parts.join(' && ') + ')');
                } else {
                    jsClauses.push('(true)');
                }
            }
            body = jsClauses.length ? jsClauses.join(' || ') : 'false';
        } else {
            for (const clause of clauses) {
                if (clause.length) {
                    const parts = clause.map(lit => {
                        const idx = Math.abs(lit) - 1;
                        const v = paramNames[idx];
                        return lit > 0 ? v : '!' + v;
                    });
                    jsClauses.push('(' + parts.join(' || ') + ')');
                } else {
                    jsClauses.push('(false)');
                }
            }
            body = jsClauses.length ? jsClauses.join(' && ') : 'true';
        }

        // Return the generated oracle function as a string
        return `function oracle(${paramNames.join(', ')}) {
        return ${body};
    }`;
    }

    window.onload = function() {
        setupSampleCodeEditors();
        //run();
    };
