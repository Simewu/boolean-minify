<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='UTF-8'>
  <title>Quine-McCluskey</title>
</head>

<body>
  <h1>Quine-McCluskey</h1>
  <textarea id='input' style='width:500px;' rows='11' readonly></textarea><br>
  <textarea id='output' style='width:500px;' rows='7' readonly></textarea>

  <script src='QuineMcCluskey.js' type='text/javascript'></script>

  <script>
    
    // Input: Arbitrary number of boolean variables (A, B, C, ...)
    // Output: true, false, or undefined (don't care)
    function inputOracleFunction(A, B, C, D, E) {
      const t1 = (((D & 1) | ((B ^ 1) & D)) ^ 1);
      const t2 = (A & (B | (B ^ 1)));
      const t3 = (A & (C ^ 1));
      const t4 = (A & C);
      const t5 = ((D ^ 1) & B & (B ^ 1));
      const t6 = (D & 0);
      const t7 = (((B & 0) | ((B ^ 1) & 0)) & D);
      const value = t1 | t2 | t3 | t4 | t5 | t6 | t7;
      return !!value;
    }

    const { js, sat } = QuineMcCluskey.solve(['A', 'B', 'C', 'D', 'E'], inputOracleFunction);


    let result = '';
    result += 'OUTPUT EXPRESSION:\n' + js + '\n\n';
    result += 'OUTPUT DIMACS SAT:\n' + sat;
    document.getElementById('output').value = result;
    document.getElementById('input').value = inputOracleFunction.toString().replace(/\n {4}/g, '\n');
  </script>
</body>

</html>
