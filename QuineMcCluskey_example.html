<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='UTF-8'>
  <title>Quine-McCluskey</title>
</head>

<body>
  <h1>Quine-McCluskey</h1>
  <textarea id='input' style='width:500px;' rows='11' readonly></textarea><br>
  <textarea id='outputDNF' style='width:500px;' rows='15' readonly placeholder="DNF Output"></textarea><br>
  <textarea id='outputCNF' style='width:500px;' rows='13' readonly placeholder="CNF Output"></textarea>

  <script src='QuineMcCluskey.js' type='text/javascript'></script>

  <script>
    // Input: Arbitrary number of boolean variables (A, B, C, ...)
    // Output: true, false, or undefined (don't care)
    function inputOracleFunction(A, B, C, D, E) {
      const t1 = (((D & 1) | ((B ^ 1) & D)) ^ 1);
      const t2 = (A & (B | (B ^ 1)));
      const t3 = (A & (C ^ 1));
      const t4 = (A & C);
      const t5 = ((D ^ 1) & B & (B ^ 1));
      const t6 = (D & 0);
      const t7 = (((B & 0) | ((B ^ 1) & 0)) & D);
      const value = t1 | t2 | t3 | t4 | t5 | t6 | t7;
      return !!value;
    }

    const dnf = QuineMcCluskey.solveDNF(['A', 'B', 'C', 'D', 'E'], inputOracleFunction, ['expr', 'sat', 'kmap']);

    let resultDNF = '';
    resultDNF += 'DNF OUTPUT EXPRESSION:\n' + dnf.expr + '\n\n';
    resultDNF += 'DNF OUTPUT DIMACS SAT:\n' + dnf.sat + '\n\n';
    resultDNF += 'DNF OUTPUT KMAP:\n' + JSON.stringify(dnf.kmap);
    document.getElementById('outputDNF').value = resultDNF;

    const cnf = QuineMcCluskey.solveCNF(['A', 'B', 'C', 'D', 'E'], inputOracleFunction, ['expr', 'sat', 'kmap']);

    let resultCNF = '';
    resultCNF += 'CNF OUTPUT EXPRESSION:\n' + cnf.expr + '\n\n';
    resultCNF += 'CNF OUTPUT DIMACS SAT:\n' + cnf.sat + '\n\n';
    resultCNF += 'CNF OUTPUT KMAP:\n' + JSON.stringify(cnf.kmap);
    document.getElementById('outputCNF').value = resultCNF;

    document.getElementById('input').value = inputOracleFunction.toString().replace(/\n {4}/g, '\n');
  </script>
</body>

</html>
